[project]
name = "smart-3d-ecosystem"
version = "0.1.0"
description = "Boids + Machine Learning 3D ecosystem demo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.38",
    "requests>=2.32",
    "torch>=2.3",
]

[project.optional-dependencies]
training = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
